name: Limbo Labs (limbolabs.com)
description: >-
  Limbo Labs was, in its own words, "a small technical team in san francisco" whose
  products were to "begin launching in july 2010". The company surfaced in the 500 Global
  portfolio listing and was added to the API Evangelist network as a lead. Enrichment
  found no company to enrich: limbolabs.com carried a single-page placeholder from 2010
  through roughly 2015 and never grew past it — an Internet Archive enumeration of the
  domain returns only eleven distinct captured URLs, all of them the one landing page
  plus its stylesheets, jQuery and four images. No product, developer portal, API
  reference, OpenAPI or Swagger document, SDK or machine-readable specification was ever
  published or archived. By 2018 the domain served a JavaScript-wall parking page, and it
  now redirects to an Afternic "for sale" lander, so the brand is retired. The website URL
  carried on the inbound 500 Global portfolio record, readyforzero.com, is a mis-joined
  row: it belongs to ReadyForZero, a separate 500 Global personal-finance company, and it
  no longer resolves. This profile is retained as a historical, defunct-provider record
  with no active API surface.
